# Publish TypeScript / Python platform clients when their paths change on main.
#
# - push to main under clients/** → detect which client(s) changed and publish
# - workflow_dispatch → optional CLIENTS override (typescript|python|all)
#
# Auth:
#   TypeScript (npm): OIDC trusted publishing (preferred). Optional NPM_TOKEN
#     fallback must be a granular access token with "Bypass 2FA" / publish rights.
#   Python (PyPI): PYPI_API_TOKEN secret
#
# npm setup (one-time, package already published at 1.0.0):
#   On npmjs.com → @afi-ai/platform-client → Trusted Publisher → GitHub Actions:
#     owner curefatih, repo afi, workflow filename release-clients.yml
#   Do not set NPM_TOKEN in GitHub secrets (it forces token auth over OIDC).
#
# Versioning: if the local version is already on the registry, the release
# script bumps the patch, publishes, commits the bump, and tags
# clients-{typescript|python}-vX.Y.Z (GITHUB_TOKEN pushes do not re-trigger).

name: Release clients

on:
  push:
    branches: [main]
    paths:
      - 'clients/typescript/**'
      - 'clients/python/**'
      - 'scripts/release-client-*.sh'
      - 'scripts/release-clients.sh'
      - 'scripts/semver.sh'
      - '.github/workflows/release-clients.yml'
  workflow_dispatch:
    inputs:
      clients:
        description: "Clients to release (typescript, python, or all)"
        required: true
        default: all
        type: choice
        options:
          - all
          - typescript
          - python
      dry_run:
        description: "Build and test without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write # npm / PyPI OIDC trusted publishing

concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Node 24 ships npm >= 11.5.1 required for trusted publishing OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semver unit tests
        run: bash scripts/semver_test.sh

      - name: Resolve clients and base ref
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "clients=${{ inputs.clients }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "dry_run=1" >> "$GITHUB_OUTPUT"
              echo "commit_bump=0" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=0" >> "$GITHUB_OUTPUT"
              echo "commit_bump=1" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "base_ref=${before}" >> "$GITHUB_OUTPUT"
          echo "dry_run=0" >> "$GITHUB_OUTPUT"
          echo "commit_bump=1" >> "$GITHUB_OUTPUT"

          clients=()
          if git diff --name-only "${before}" HEAD -- \
              clients/typescript scripts/release-client-typescript.sh | grep -q .; then
            clients+=(typescript)
          fi
          if git diff --name-only "${before}" HEAD -- \
              clients/python scripts/release-client-python.sh | grep -q .; then
            clients+=(python)
          fi
          if [[ ${#clients[@]} -eq 0 ]]; then
            echo "clients=" >> "$GITHUB_OUTPUT"
          else
            IFS=,; echo "clients=${clients[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.resolve.outputs.clients != ''
        env:
          # Do not pass NPM_TOKEN here — it forces token auth and breaks OIDC
          # (E404 when Trusted Publisher is expected). Local/manual token publish
          # can still set NODE_AUTH_TOKEN / NPM_FORCE_TOKEN=1 explicitly.
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          COMMIT_BUMP: ${{ steps.resolve.outputs.commit_bump }}
          CLIENTS: ${{ steps.resolve.outputs.clients }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
        run: bash scripts/release-clients.sh

      - name: Push version bumps
        if: steps.resolve.outputs.clients != '' && steps.resolve.outputs.commit_bump == '1'
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Nothing to release
        if: steps.resolve.outputs.clients == ''
        run: echo "No client path changes — skipping publish."
