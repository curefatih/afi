# Publish TypeScript / Python / Java platform clients when their paths change on main.
#
# - push to main under clients/** → detect which client(s) changed and publish
# - workflow_dispatch → optional CLIENTS override (typescript|python|java|all)
#
# npm (OIDC trusted publishing — no NPM_TOKEN):
#   https://www.npmjs.com/package/@afi-ai/platform-client/access
#   → Trusted Publisher → GitHub Actions
#     Owner: curefatih | Repo: afi | Workflow: release-clients.yml
#     Allowed actions: include "npm publish"
#     Environment: leave blank (must match this workflow)
#
# Python: PYPI_API_TOKEN secret (or PyPI trusted publisher)
# Java: GitHub Packages via GITHUB_TOKEN (packages:write)
#
# Version bump PR (main is PR-only):
#   Enable Actions → "Allow GitHub Actions to create and approve pull requests"
#   OR set secret CLIENT_RELEASE_GH_TOKEN (PAT with contents + pull requests)

name: Release clients

on:
  push:
    branches: [main]
    paths:
      - 'clients/typescript/**'
      - '!clients/typescript/package.json'
      - 'clients/python/**'
      - '!clients/python/pyproject.toml'
      - 'clients/java/**'
      - '!clients/java/pom.xml'
      - 'scripts/release-client-*.sh'
      - 'scripts/release-clients.sh'
      - 'scripts/open-client-version-pr.sh'
      - 'scripts/semver.sh'
      - '.github/workflows/release-clients.yml'
  workflow_dispatch:
    inputs:
      clients:
        description: "Clients to release (typescript, python, java, or all)"
        required: true
        default: all
        type: choice
        options:
          - all
          - typescript
          - python
          - java
      dry_run:
        description: "Build and test without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Version-sync PRs must not republish.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Do NOT set registry-url here — it writes _authToken=${NODE_AUTH_TOKEN}
      # into .npmrc and forces token auth, which breaks OIDC (E404).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; 11.6.2 is a known-good OIDC build.
      # Do not use setup-node registry-url — it writes empty _authToken and
      # short-circuits OIDC (ENEEDAUTH). See actions/setup-node#1551.
      - name: Ensure npm for OIDC
        run: |
          npm install -g npm@11.6.2
          node -v
          npm -v
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL missing — id-token: write not effective" >&2
            exit 1
          }
          # Defensive: remove any authToken written earlier in the job.
          for rc in "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP}/.npmrc" "${HOME}/.npmrc"; do
            if [[ -n "${rc}" && -f "${rc}" ]] && grep -q '_authToken' "${rc}"; then
              grep -v '_authToken' "${rc}" >"${rc}.tmp" && mv "${rc}.tmp" "${rc}"
              echo "scrubbed _authToken from ${rc}"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: clients/java/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Semver unit tests
        run: bash scripts/semver_test.sh

      - name: Resolve clients and base ref
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "clients=${{ inputs.clients }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "dry_run=1" >> "$GITHUB_OUTPUT"
              echo "commit_bump=0" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=0" >> "$GITHUB_OUTPUT"
              echo "commit_bump=1" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "base_ref=${before}" >> "$GITHUB_OUTPUT"
          echo "dry_run=0" >> "$GITHUB_OUTPUT"
          echo "commit_bump=1" >> "$GITHUB_OUTPUT"

          clients=()
          if git diff --name-only "${before}" HEAD -- \
              clients/typescript scripts/release-client-typescript.sh | grep -q .; then
            clients+=(typescript)
          fi
          if git diff --name-only "${before}" HEAD -- \
              clients/python scripts/release-client-python.sh | grep -q .; then
            clients+=(python)
          fi
          if git diff --name-only "${before}" HEAD -- \
              clients/java scripts/release-client-java.sh | grep -q .; then
            clients+=(java)
          fi
          if [[ ${#clients[@]} -eq 0 ]]; then
            echo "clients=" >> "$GITHUB_OUTPUT"
          else
            IFS=,; echo "clients=${clients[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.resolve.outputs.clients != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          COMMIT_BUMP: ${{ steps.resolve.outputs.commit_bump }}
          CLIENTS: ${{ steps.resolve.outputs.clients }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
        run: bash scripts/release-clients.sh

      - name: Push tags and open version bump PR
        if: steps.resolve.outputs.clients != '' && steps.resolve.outputs.commit_bump == '1'
        env:
          # GITHUB_TOKEN cannot create PRs unless the repo enables
          # "Allow GitHub Actions to create and approve pull requests".
          # Optional CLIENT_RELEASE_GH_TOKEN (PAT) bypasses that restriction.
          GH_TOKEN: ${{ secrets.CLIENT_RELEASE_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/open-client-version-pr.sh

      - name: Nothing to release
        if: steps.resolve.outputs.clients == ''
        run: echo "No client path changes — skipping publish."
