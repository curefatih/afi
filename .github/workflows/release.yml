# Build portable AFI binaries (binary + config is enough to run).
#
# - workflow_dispatch: build all targets and upload workflow artifacts
# - push tags v*: same builds, then publish a GitHub Release with tarballs
#
# Each archive contains controlplane, gateway, worker, afi, and afi.example.yaml.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifacts (default: git describe / tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: "1"
        run: bash scripts/build-release.sh

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: afi-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Install

            Each archive is enough to run AFI on that OS/arch:

            - `controlplane`, `gateway`, `worker`, `afi` — binaries
            - `afi.example.yaml` — copy to `afi.yaml`, replace `CHANGE_ME` values

            ```bash
            tar -xzf afi-*-linux-amd64.tar.gz
            cd afi-*-linux-amd64
            cp afi.example.yaml afi.yaml
            # edit afi.yaml, then:
            export AFI_CONFIG=$PWD/afi.yaml
            ./controlplane
            ```

            Postgres is required. Redis is required only for timed quotas.
            Full guide: https://afi.fatihcure.com/deployment/binary/
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
