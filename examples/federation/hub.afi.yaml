# Hub YAML shared by hub CP + gateway. Federation home mode is set via
# AFI_FEDERATION_MODE=home on the control plane service in Compose.

database_url: "postgres://afi:afi-federation-hub@hub-postgres:5432/afi?sslmode=disable"
redis_url: "redis://hub-redis:6379/0"

controlplane:
  addr: ":8081"

gateway:
  addr: ":8080"
  snapshot_poll_interval: "2s"
  snapshot_backend: postgres

auth:
  jwt_secret: "afi-federation-jwt-secret"
  token_ttl: "24h"
  internal_token: "afi-federation-internal-token"

seed:
  virtual_api_key: "sk-federation-lab-hub-key"
  admin_email: "admin@afi.local"
  admin_password: "admin"
  admin_name: "Hub Admin"
  openai_base_url: "https://api.openai.com/v1"
  openai_api_key_env: "OPENAI_API_KEY"
  default_model: "gpt-4o-mini"

events:
  outbox_enabled: false
  publisher: log
