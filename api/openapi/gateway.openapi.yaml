openapi: 3.1.0
info:
  title: AFI Gateway API (overlay)
  description: |
    Data-plane overlay for the AFI gateway (default `:8080`).

    **Do not treat this as a full OpenAI/Anthropic/Gemini/MCP/A2A schema.** Point official
    vendor SDKs at the gateway base URL. This document covers AFI-specific auth,
    headers, path map, and `/healthz`.

    External references:
    - OpenAI API: https://platform.openai.com/docs/api-reference
    - Anthropic Messages: https://docs.anthropic.com/en/api/messages
    - Gemini API: https://ai.google.dev/api/generate-content
    - MCP Streamable HTTP: https://modelcontextprotocol.io
    - A2A protocol: https://a2a-protocol.org
  version: 1.0.0

externalDocs:
  description: AFI public documentation
  url: https://afi.fatihcure.com

servers:
  - url: http://localhost:8080
    description: Local gateway

security:
  - virtualKeyAuth: []
  - anthropicAPIKey: []
  - geminiAPIKey: []

tags:
  - name: Health
  - name: OpenAICompatible
    description: OpenAI-shaped paths; request/response bodies follow OpenAI (or AFI-enriched models list).
  - name: Anthropic
    description: Native Anthropic Messages shape.
  - name: Gemini
    description: Native Gemini generateContent shape; model path segment is an AFI route alias.
  - name: MCP
    description: MCP Streamable HTTP proxy by alias.
  - name: A2A
    description: A2A JSON-RPC and Agent Card proxy by alias.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: gatewayHealthz
      security: []
      summary: Gateway liveness
      description: Returns status, snapshot_version, and registered provider/hook info.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/models:
    get:
      tags: [OpenAICompatible]
      operationId: listModels
      summary: List routable models
      description: |
        OpenAI-shaped model list enriched from org routes and the model catalog.
        Alias of `GET /openai/v1/models`.
        See OpenAI Models API for the general shape.
      parameters:
        - $ref: "#/components/parameters/AFITags"
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /openai/v1/models:
    get:
      tags: [OpenAICompatible]
      operationId: listModelsOpenAIDialect
      summary: List routable models (OpenAI dialect)
      description: |
        Canonical OpenAI dialect models path. Same as `GET /v1/models`.
      parameters:
        - $ref: "#/components/parameters/AFITags"
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/chat/completions:
    post:
      tags: [OpenAICompatible]
      operationId: chatCompletions
      summary: Chat completions
      description: |
        OpenAI dialect chat completions (alias of `POST /openai/v1/chat/completions`).
        Routed via chat IR to any chat-capable provider. Body follows the OpenAI Chat Completions schema.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/chat
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: OpenAI chat completion request.
      responses:
        "200":
          description: Completion or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openai/v1/chat/completions:
    post:
      tags: [OpenAICompatible]
      operationId: chatCompletionsOpenAIDialect
      summary: Chat completions (OpenAI dialect)
      description: |
        Canonical OpenAI dialect path. Same behavior as `POST /v1/chat/completions`.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/chat
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Completion or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/embeddings:
    post:
      tags: [OpenAICompatible]
      operationId: createEmbeddings
      summary: Embeddings
      description: |
        OpenAI-compatible embeddings (alias of `POST /openai/v1/embeddings`).
        Body follows the OpenAI Embeddings schema.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/embeddings
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Embedding response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openai/v1/embeddings:
    post:
      tags: [OpenAICompatible]
      operationId: createEmbeddingsOpenAIDialect
      summary: Embeddings (OpenAI dialect)
      description: |
        Canonical OpenAI dialect embeddings path. Same as `POST /v1/embeddings`.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/embeddings
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Embedding response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/images/generations:
    post:
      tags: [OpenAICompatible]
      operationId: createImage
      summary: Image generation
      description: |
        OpenAI-compatible image generations (alias of `POST /openai/v1/images/generations`).
        Body follows the OpenAI Images schema.
        When the organization has object store enabled in the control plane, generated
        assets may be persisted and response URLs rewritten to presigned object URLs.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/images/create
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Image generation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openai/v1/images/generations:
    post:
      tags: [OpenAICompatible]
      operationId: createImageOpenAIDialect
      summary: Image generation (OpenAI dialect)
      description: |
        Canonical OpenAI dialect images path. Same as `POST /v1/images/generations`.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/images/create
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Image generation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/audio/speech:
    post:
      tags: [OpenAICompatible]
      operationId: audioSpeech
      summary: Text-to-speech
      description: |
        OpenAI-compatible TTS (alias of `POST /openai/v1/audio/speech`).
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/audio/createSpeech
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Audio bytes
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openai/v1/audio/speech:
    post:
      tags: [OpenAICompatible]
      operationId: audioSpeechOpenAIDialect
      summary: Text-to-speech (OpenAI dialect)
      description: |
        Canonical OpenAI dialect TTS path. Same as `POST /v1/audio/speech`.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/audio/createSpeech
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Audio bytes
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/audio/transcriptions:
    post:
      tags: [OpenAICompatible]
      operationId: audioTranscriptions
      summary: Speech-to-text
      description: |
        OpenAI-compatible transcriptions (multipart; alias of `POST /openai/v1/audio/transcriptions`).
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/audio/createTranscription
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openai/v1/audio/transcriptions:
    post:
      tags: [OpenAICompatible]
      operationId: audioTranscriptionsOpenAIDialect
      summary: Speech-to-text (OpenAI dialect)
      description: |
        Canonical OpenAI dialect STT path. Same as `POST /v1/audio/transcriptions`.
      externalDocs:
        url: https://platform.openai.com/docs/api-reference/audio/createTranscription
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /gemini/v1beta/models/{model}:generateContent:
    post:
      tags: [Gemini]
      operationId: geminiGenerateContent
      summary: Generate content (Gemini dialect)
      description: |
        Native Gemini generateContent client shape. `{model}` is an AFI route alias
        and may target any chat-capable upstream provider.
      externalDocs:
        url: https://ai.google.dev/api/generate-content
      security:
        - virtualKeyAuth: []
        - geminiAPIKey: []
        - geminiQueryKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: AFI route alias, not necessarily a Gemini model id.
          schema:
            type: string
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Gemini GenerateContentResponse
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /gemini/v1beta/models/{model}:streamGenerateContent:
    post:
      tags: [Gemini]
      operationId: geminiStreamGenerateContent
      summary: Stream generate content (Gemini dialect)
      description: |
        Native Gemini streaming client shape. The gateway emits Gemini SSE events.
        `{model}` is an AFI route alias and may target any streaming chat provider.
      externalDocs:
        url: https://ai.google.dev/api/generate-content
      security:
        - virtualKeyAuth: []
        - geminiAPIKey: []
        - geminiQueryKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: AFI route alias, not necessarily a Gemini model id.
          schema:
            type: string
        - name: alt
          in: query
          required: false
          schema:
            type: string
            enum: [sse]
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Gemini SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/messages:
    post:
      tags: [Anthropic]
      operationId: anthropicMessages
      summary: Anthropic Messages
      description: |
        Anthropic Messages dialect (alias of `POST /anthropic/v1/messages`).
        Decoded to chat IR and served by any chat-capable routed provider.
      externalDocs:
        url: https://docs.anthropic.com/en/api/messages
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Message response or stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /anthropic/v1/messages:
    post:
      tags: [Anthropic]
      operationId: anthropicMessagesDialect
      summary: Anthropic Messages (dialect)
      description: |
        Canonical Anthropic dialect path. Same behavior as `POST /v1/messages`.
        Set `ANTHROPIC_BASE_URL` to the gateway origin + `/anthropic`.
      externalDocs:
        url: https://docs.anthropic.com/en/api/messages
      parameters:
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Message response or stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /mcp/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: MCP backend alias configured in the platform.
      - $ref: "#/components/parameters/AFITags"
    post:
      tags: [MCP]
      operationId: mcpProxyPost
      summary: MCP Streamable HTTP (POST)
      description: Proxies MCP Streamable HTTP to the configured upstream for `alias`.
      externalDocs:
        url: https://modelcontextprotocol.io
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Upstream MCP response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [MCP]
      operationId: mcpProxyGet
      summary: MCP Streamable HTTP (GET)
      description: Proxies MCP Streamable HTTP GET for session resume / SSE as supported upstream.
      responses:
        "200":
          description: Upstream MCP response
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [MCP]
      operationId: mcpProxyDelete
      summary: MCP Streamable HTTP (DELETE)
      description: Proxies MCP Streamable HTTP DELETE to end a session when supported upstream.
      responses:
        "200":
          description: Upstream MCP response
        "401":
          $ref: "#/components/responses/Unauthorized"

  /a2a/{alias}:
    post:
      tags: [A2A]
      operationId: a2aJSONRPC
      summary: A2A JSON-RPC
      description: Proxies A2A JSON-RPC to the configured agent upstream for `alias`.
      externalDocs:
        url: https://a2a-protocol.org
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AFITags"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /a2a/{alias}/.well-known/agent-card.json:
    get:
      tags: [A2A]
      operationId: a2aAgentCard
      summary: A2A Agent Card
      description: |
        Fetches the upstream agent card and rewrites URLs to the gateway public path
        for this alias.
      security: []
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent Card JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    virtualKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Virtual API key issued by the platform (typically `sk-…`).
        Anthropic dialect clients may instead send `x-api-key: <virtual-api-key>`.
    anthropicAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Anthropic SDK-style virtual API key (same value as Bearer).
    geminiAPIKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gemini SDK-style virtual API key (same value as Bearer).
    geminiQueryKey:
      type: apiKey
      in: query
      name: key
      description: Gemini REST query-style virtual API key (same value as Bearer).

  parameters:
    AFITags:
      name: X-AFI-Tags
      in: header
      required: false
      description: |
        Optional external tags as `key:value` pairs, comma-separated.
        Example: `env:prod,team:billing`. Keys/values are trimmed; last duplicate key wins.
      schema:
        type: string
        example: "env:prod,team:billing"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid virtual API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
